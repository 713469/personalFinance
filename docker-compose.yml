services:
  mysql:
    image: mysql:8.4
    container_name: pft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: personal_finance_tracker
      MYSQL_USER: pft
      MYSQL_PASSWORD: pft_password
      TZ: Asia/Shanghai
    ports:
      - "43306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: personal-finance-tracker-backend:local
    container_name: pft-backend
    restart: unless-stopped
    working_dir: /workspace
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SPRING_DATASOURCE_USERNAME: pft
      SPRING_DATASOURCE_PASSWORD: pft_password
      SERVER_PORT: 48080
    volumes:
      - ./backend:/workspace
      - type: bind
        source: ${USERPROFILE}/.m2
        target: /root/.m2
    ports:
      - "48080:48080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: personal-finance-tracker-frontend:local
    container_name: pft-frontend
    restart: unless-stopped
    working_dir: /workspace
    environment:
      VITE_API_PROXY_TARGET: http://backend:48080
      VITE_DEV_SERVER_PORT: 45173
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
      - type: bind
        source: ${LOCALAPPDATA}/npm-cache
        target: /root/.npm
    ports:
      - "45173:45173"
    depends_on:
      - backend

volumes:
  mysql-data:
  frontend-node-modules:
